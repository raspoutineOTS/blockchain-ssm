name: CI Tests

on:
  push:
    branches: [ master, claude/* ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  # Job 1: Go Unit Tests
  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      working-directory: ./chaincode/go/ssm
      run: go mod download

    - name: Run Go tests
      working-directory: ./chaincode/go/ssm
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Generate coverage report
      working-directory: ./chaincode/go/ssm
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: go-coverage
        path: chaincode/go/ssm/coverage.html

  # Job 2: JavaScript Integration Tests
  js-tests:
    name: JavaScript Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Cache npm packages
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      working-directory: ./test
      run: npm ci

    - name: Run ITMO integration tests
      working-directory: ./test
      run: npm run test:itmo

    - name: Run DeFi integration tests
      working-directory: ./test
      run: npm run test:defi

    - name: Generate coverage
      working-directory: ./test
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./test/coverage/lcov.info
        flags: integration
        name: integration-tests

  # Job 3: Linting
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        working-directory: chaincode/go/ssm

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install ESLint
      working-directory: ./test
      run: npm install --save-dev eslint

    - name: Run ESLint
      working-directory: ./test
      run: npx eslint "**/*.js" || true

  # Job 4: Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run npm audit
      working-directory: ./test
      run: npm audit --audit-level=moderate || true

  # Job 5: Build Chaincode
  build:
    name: Build Chaincode
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build chaincode
      working-directory: ./chaincode/go/ssm
      run: go build -v ./...

    - name: Verify build artifacts
      working-directory: ./chaincode/go/ssm
      run: |
        if [ ! -f "ssm" ]; then
          echo "Build failed: ssm binary not found"
          exit 1
        fi
        echo "✓ Build successful"

  # Job 6: Documentation Check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for README files
      run: |
        required_docs=("README.md" "ITMO_README.md" "DEFI_README.md" "test/README.md")
        for doc in "${required_docs[@]}"; do
          if [ ! -f "$doc" ]; then
            echo "Missing documentation: $doc"
            exit 1
          fi
        done
        echo "✓ All required documentation present"

    - name: Check Markdown lint
      uses: DavidAnson/markdownlint-cli2-action@v13
      with:
        globs: '**/*.md'

  # Job 7: Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [go-tests, js-tests, lint, security, build, docs]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "=== Test Summary ==="
        echo "Go Tests: ${{ needs.go-tests.result }}"
        echo "JS Tests: ${{ needs.js-tests.result }}"
        echo "Linting: ${{ needs.lint.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Build: ${{ needs.build.result }}"
        echo "Docs: ${{ needs.docs.result }}"

        if [ "${{ needs.go-tests.result }}" != "success" ] || \
           [ "${{ needs.js-tests.result }}" != "success" ]; then
          echo "❌ Tests failed"
          exit 1
        fi

        echo "✅ All tests passed"

    - name: Create test badge
      uses: schneegans/dynamic-badges-action@v1.6.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: your-gist-id
        filename: test-badge.json
        label: Tests
        message: ${{ needs.go-tests.result == 'success' && needs.js-tests.result == 'success' && 'passing' || 'failing' }}
        color: ${{ needs.go-tests.result == 'success' && needs.js-tests.result == 'success' && 'green' || 'red' }}
